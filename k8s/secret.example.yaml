# Template only. In production, source these from Azure Key Vault
# (Secrets Store CSI driver or External Secrets) instead of a plain Secret.
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-rag-secrets
  namespace: enterprise-rag
type: Opaque
stringData:
  # Azure Database for PostgreSQL Flexible Server (allow-list the `vector` extension).
  DATABASE_URL: "postgresql+psycopg://rag_app:<password>@<server>.postgres.database.azure.com:5432/rag?sslmode=require"
  ADMIN_DATABASE_URL: "postgresql+psycopg://rag_admin:<password>@<server>.postgres.database.azure.com:5432/rag?sslmode=require"
  # Omit to use workload identity for Azure OpenAI.
  AZURE_OPENAI_API_KEY: ""
  GRAPH_CLIENT_ID: ""
  GRAPH_CLIENT_SECRET: ""
